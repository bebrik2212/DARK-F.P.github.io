<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.8">
    <meta name="theme-color" content="#0b0b0e">
    <title>DARK FORT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <div class="profile-row">
            <img class="avatar" id="profileAvatar" src="https://i.pinimg.com/236x/ca/32/a0/ca32a08ba5cdefbffa115c6cced9f519.jpg" alt="Аватар">
            <input type="file" id="avatarUpload" class="avatar-input" accept="image/*">
            <div class="nick-wrap">
                <input type="text" class="nick-input" id="nicknameInput" placeholder="Введите ник" maxlength="20">
                <div class="nick-error-msg" id="nickErrorMsg">НИК ЗАНЯТ</div>
            </div>
            <button class="bell" id="bellBtn" type="button">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                <span class="bell-count" id="notifCount">0</span>
            </button>
        </div>

        <div class="tabs" role="tablist">
            <button id="tabFeed" class="active" type="button">ПОСТЫ</button>
            <button id="tabCreate" type="button">СДЕЛАТЬ ПОСТ</button>
            <button id="tabProfile" type="button">ТВОЙ ПРОФИЛЬ</button>
        </div>

        <div class="notif-panel" id="notificationPanel"></div>

        <div id="feedSection" class="section active">
            <div class="posts-list" id="postsListFeed">
                <div class="empty-posts">ЗАГРУЗКА...</div>
            </div>
        </div>

        <div id="createSection" class="section">
            <div class="create-post">
                <textarea class="post-input" id="postText" maxlength="5000" placeholder="ЧТО НОВОГО?"></textarea>
                <div class="media-preview" id="mediaPreview"></div>
                <button class="attach-btn" id="attachBtn" type="button">
                    <img src="https://media.tenor.com/jtS4RMiJDXUAAAAj/clippy-windows-xp.gif" alt="прикрепить">
                </button>
                <input type="file" id="mediaUpload" accept="image/*,video/*" multiple hidden>
                <div id="uploadStatus" class="upload-status"></div>
                <button class="btn" id="publishBtn" type="button">ОПУБЛИКОВАТЬ</button>
            </div>
        </div>

        <div id="profileSection" class="section">
            <div class="profile-info">
                <img id="profileBigAvatar" src="https://litmir.club/data/Author/279000/279758/Фото_Нуремхет_Аноним_b86a9.jpg" alt="аватар">
                <h3 id="profileNickname">ТВОЙ НИК</h3>
                <p>МОИ ПОСТЫ</p>
            </div>
            <div class="posts-list" id="postsListProfile">
                <div class="empty-posts">НЕТ ПОСТОВ</div>
            </div>
        </div>
    </div>

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="script.js"></script>
</body>
</html>
