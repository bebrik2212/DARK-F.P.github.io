<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.8">
    <meta name="theme-color" content="#0a0a0c">
    <title>DARK FORT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-left">
                <div class="logo">DARK FORT</div>
                <div class="logo-sub">PORT</div>
            </div>
            <div class="header-right">
                <button class="notif-btn" id="notifBtn">
                    <span class="notif-icon">🔔</span>
                    <span class="notif-badge" id="notifBadge">0</span>
                </button>
            </div>
        </header>

        <div class="profile-bar">
            <img class="avatar" id="profileAvatar" src="https://i.pinimg.com/236x/ca/32/a0/ca32a08ba5cdefbffa115c6cced9f519.jpg" alt="avatar">
            <input type="file" id="avatarUpload" accept="image/*" hidden>
            <div class="nick-wrap">
                <input type="text" class="nick-input" id="nickInput" placeholder="NICKNAME" maxlength="20">
                <div class="nick-error" id="nickError">NICKNAME TAKEN</div>
            </div>
        </div>

        <nav class="tabs">
            <button class="tab active" data-tab="feed">POSTS</button>
            <button class="tab" data-tab="create">NEW POST</button>
            <button class="tab" data-tab="profile">PROFILE</button>
        </nav>

        <div class="notif-panel" id="notifPanel"></div>

        <main class="content">
            <section class="tab-content active" id="feed">
                <div class="posts" id="postsFeed">
                    <div class="empty">LOADING...</div>
                </div>
            </section>

            <section class="tab-content" id="create">
                <div class="create-box">
                    <textarea class="post-textarea" id="postText" placeholder="TYPE YOUR MESSAGE..." maxlength="5000"></textarea>
                    <div class="media-preview" id="mediaPreview"></div>
                    <div class="create-actions">
                        <button class="attach-btn" id="attachBtn">ATTACH</button>
                        <input type="file" id="mediaUpload" accept="image/*,video/*" multiple hidden>
                        <span class="upload-info" id="uploadInfo"></span>
                        <button class="publish-btn" id="publishBtn">PUBLISH</button>
                    </div>
                </div>
            </section>

            <section class="tab-content" id="profile">
                <div class="profile-info">
                    <img class="profile-avatar-big" id="profileBigAvatar" src="https://i.pinimg.com/236x/ca/32/a0/ca32a08ba5cdefbffa115c6cced9f519.jpg" alt="avatar">
                    <h2 class="profile-nick" id="profileNick">NICKNAME</h2>
                    <p class="profile-label">MY POSTS</p>
                </div>
                <div class="posts" id="postsProfile">
                    <div class="empty">NO POSTS</div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
